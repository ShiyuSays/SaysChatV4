// SaysChatV4.1.0 安卓客户端
// 推荐用 Android Studio 打开 android/ 目录构建；
// 或无 Gradle 命令行构建：在项目根目录运行 build-apk.bat / build-apk.sh。
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
