apply plugin: 'com.android.application'

android {
    compileSdkVersion 30

    defaultConfig {
        applicationId "sayschat.android"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 11
        versionName "4.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 共用 ../../src/common 下的协议、JSON 与加密代码
    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java', '../../src/common']
            res.srcDirs = ['src/main/res']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// 无第三方依赖
dependencies {
}
